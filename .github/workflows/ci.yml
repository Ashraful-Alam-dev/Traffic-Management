name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: bus
          POSTGRES_DB: bus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bus:bus@localhost:5432/bus_test
      DIRECT_URL: postgresql://bus:bus@localhost:5432/bus_test
      DATABASE_URL_TEST: postgresql://bus:bus@localhost:5432/bus_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx @redocly/cli@1 lint public/openapi.yaml
